name: awzeal image

on:
  push:
    branches: [ai]
    paths: [aipack/**, image/**, src/Kernel/**, .github/workflows/awzeal-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f image/Containerfile -t awzeal:ci .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Smoke test (boots ZealOS, ring-0 answer must come back)
        run: |
          timeout 900 docker run --rm --device /dev/kvm -e AWZEAL_SMP=2 \
            -e AWZEAL_PROMPT="What is the capital of France? One sentence." \
            awzeal:ci 2>&1 | tee smoke.log
          grep -q "\[AIAGENT\] PASS" smoke.log
          grep -qi "paris" smoke.log

      - name: Push to GHCR
        if: github.ref == 'refs/heads/ai'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/aitherium/awzeal
          docker tag awzeal:ci $img:latest
          docker tag awzeal:ci $img:sha-${GITHUB_SHA::12}
          docker push $img:latest
          docker push $img:sha-${GITHUB_SHA::12}
